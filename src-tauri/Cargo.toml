[package]
name = "bookforge"
version = "0.1.0"
description = "BookForge — a Tauri-based book writing IDE with embedded AI and REPL"
authors = ["BookForge"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "bookforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.0"

# Model / AI
llama-cpp-2 = "0.1"
num_cpus = "1.16"

# Async / serialization
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

# Filesystem / projects
walkdir = "2.5"
dirs = "5.0"
notify = "6.1"

# Markdown / HTML
pulldown-cmark = "0.12"

# EPUB
epub-builder = "0.7"

# PDF
printpdf = "0.7"

# Misc
once_cell = "1.20"
parking_lot = "0.12"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
log = "0.4"
env_logger = "0.11"

# PTY / terminal — portable-pty works on Windows out of the box
# (uses ConPTY on Windows 10+ for full PTY semantics)
portable-pty = "0.8"

[target.'cfg(windows)'.dependencies]
# Windows-specific helpers (used by portable-pty internally, listed for clarity)
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

[features]
# This feature is used for production builds where `devPath` points to the bundled assets.
custom-protocol = ["tauri/custom-protocol"]
